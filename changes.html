<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>版本變更 — 字字有聲</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="min-h-screen bg-page font-sans text-ink">
  <main class="mx-auto max-w-3xl px-6 py-12">
    <a class="text-sm text-brand hover:underline" href="./">← 返回華語雙拼編輯器</a>
    <h1 class="mt-5 mb-6 text-3xl font-bold">版本變更</h1>
    <section id="v0.0.1" class="rounded-2xl border border-line bg-white p-6" aria-labelledby="version-title">
      <h2 id="version-title" class="text-xl font-semibold">v0.0.1 首次發布</h2>
      <ul class="mt-4 list-disc space-y-2 pl-5 leading-relaxed">
        <li>輸入華語文字後，即時顯示漢語拼音與直排注音。</li>
        <li>點擊個別字的拼音或注音，即可手動修正讀音。</li>
        <li>滑鼠移到漢字時會框選整組標記，可下載單字與讀音的 PNG。</li>
        <li>可調整預覽字級，預設為 64 px，並支援列印或另存 PDF。</li>
      </ul>
    </section>
  </main>
</body>
</html>
